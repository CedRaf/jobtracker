name: JobStreet + LinkedIn scraper

on:
  # No cron schedule: GitHub started scheduled runs hours late. The Google Apps
  # Script timer (startScraper in apps_script/Code.gs) triggers this at
  # 11 AM and 3 PM Manila time instead, the same way as the button below.
  workflow_dispatch:          # "Run workflow" button on the Actions tab
    inputs:
      limit:
        description: "Only evaluate this many new jobs (blank = all)"
        required: false
        default: ""

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Show trigger
        run: |
          echo "Event: ${{ github.event_name }}  Started by: ${{ github.actor }}"
          echo "Started (Manila): $(TZ=Asia/Manila date '+%Y-%m-%d %H:%M')"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # Runners start empty each time; carry the "already seen" job list over
      # between runs so job details aren't re-fetched. (The sheet dedups anyway.)
      - name: Restore seen job IDs
        uses: actions/cache/restore@v4
        with:
          path: scraper/data/seen_ids.json
          key: seen-ids-${{ github.run_id }}
          restore-keys: seen-ids-

      - name: Restore seen LinkedIn job IDs
        uses: actions/cache/restore@v4
        with:
          path: scraper/data/linkedin_seen_ids.json
          key: linkedin-seen-ids-${{ github.run_id }}
          restore-keys: linkedin-seen-ids-

      - name: Run scraper
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LIMIT: ${{ inputs.limit }}
        working-directory: scraper
        run: python scraper.py ${LIMIT:+--limit "$LIMIT"}

      # Same settings and timing as JobStreet; runs even if JobStreet failed.
      - name: Run LinkedIn scraper
        if: ${{ !cancelled() }}
        # The scraper stops itself after its time budget (config.json
        # "linkedin", 20 min); this is the backstop, so a stuck LinkedIn step
        # can't use up the whole job and stop the seen-ID caches being saved.
        timeout-minutes: 30
        env:
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LIMIT: ${{ inputs.limit }}
        working-directory: scraper
        run: python LinkedIn_Scraper.py ${LIMIT:+--limit "$LIMIT"}

      - name: Save seen job IDs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/data/seen_ids.json
          key: seen-ids-${{ github.run_id }}

      - name: Save seen LinkedIn job IDs
        if: always() && hashFiles('scraper/data/linkedin_seen_ids.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scraper/data/linkedin_seen_ids.json
          key: linkedin-seen-ids-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_id }}
          path: scraper/logs/
          retention-days: 7
